<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones Rojas de Interpol</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background-color: #f4f4f9; 
    }
    h1 { 
      color: #b30000; 
      text-align: center;
    }
    
    /* Contenedor de búsqueda */
    .search-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-container input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .search-container button {
      padding: 10px 20px;
      background-color: #b30000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .search-container button:hover {
      background-color: #800000;
    }

    /* Grid responsivo */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card { 
      background: white; 
      padding: 15px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar {
      width: 140px;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e0e0e0;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 10px 0 5px 0;
      font-size: 1rem;
    }
    .card p {
      margin: 0;
      color: #555;
      font-size: 0.85rem;
    }

    /* Paginación */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
    }
    .pagination button {
      padding: 8px 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .pagination button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Notificaciones Rojas - Interpol</h1>

  <!-- Controles de búsqueda -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar por apellido...">
    <button onclick="handleSearch()">Buscar</button>
  </div>

  <div id="results">Cargando datos...</div>

  <!-- Controles de paginación -->
  <div class="pagination">
    <button id="prevBtn" onclick="changePage(-1)" disabled>Anterior</button>
    <span id="pageIndicator">Página 1</span>
    <button id="nextBtn" onclick="changePage(1)">Siguiente</button>
  </div>

  <script>
    let currentPage = 1;
    let currentSearchTerm = '';

    async function loadNotices() {
      const container = document.getElementById('results');
      container.innerHTML = '<p>Cargando datos...</p>';

      try {
        // Construimos los parámetros dinámicamente
        const queryParams = new URLSearchParams({ page: currentPage });

        // Solo añadimos el término de búsqueda si no está vacío
        if (currentSearchTerm && currentSearchTerm.trim() !== '') {
          queryParams.append('name', currentSearchTerm.trim());
        }

        const res = await fetch(`/api/notices?${queryParams.toString()}`);
        const data = await res.json();
        
        container.innerHTML = '';
        const notices = data._embedded?.notices || [];
        
        if (notices.length === 0) {
          container.innerHTML = '<p>No se encontraron resultados.</p>';
          return;
        }

        notices.forEach(notice => {
          const imageUrl = notice._links?.thumbnail?.href || '';

          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `
            <img 
              class="avatar" 
              src="${imageUrl}" 
              alt="Foto"
              onerror="this.src='https://via.placeholder.com/140x160?text=Sin+Foto';"
            />
            <h3>${notice.forename || ''} ${notice.name || ''}</h3>
            <p><strong>Nacionalidad:</strong> ${notice.nationalities ? notice.nationalities.join(', ') : 'Desconocida'}</p>
          `;
          container.appendChild(div);
        });

        // Actualizar UI de paginación
        document.getElementById('pageIndicator').innerText = `Página ${currentPage}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;

      } catch (err) {
        container.innerHTML = '<p>Error al cargar los datos.</p>';
      }
    }

    function handleSearch() {
      currentSearchTerm = document.getElementById('searchInput').value.trim();
      currentPage = 1; // Reiniciar a la primera página con cada búsqueda
      loadNotices();
    }

    function changePage(step) {
      currentPage += step;
      loadNotices();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Carga inicial
    loadNotices();
  </script>
</body>
</html>
